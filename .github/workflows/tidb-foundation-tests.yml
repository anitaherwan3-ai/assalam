name: TiDB foundation tests

on:
  push:
    branches:
      - migration/tidb-foundation
      - fix/tidb-localstorage-cache-only-2026-11-25
      - main
  pull_request:
    branches:
      - migration/tidb-foundation
      - fix/tidb-localstorage-cache-only-2026-11-25
      - main

jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run backend tests and verify guarded build step
        run: npm run build

name: TiDB foundation tests

on:
  push:
    branches:
      - migration/tidb-foundation
  pull_request:
    branches:
      - migration/tidb-foundation

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run backend foundation tests
        run: npm test

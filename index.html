<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sistem Keuangan & Operasional Klinik</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Firebase Compat Web SDK (CDN) - Free Backend -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- jsPDF & autoTable (CDN) for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <!-- Chart.js (CDN) for Executive Visual Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Header Utama -->
  <header>
    <h1>
      <span id="brand-logo">🏥</span>
      <span id="brand-title">Klinik Sehat Pratama</span>
    </h1>
    <div class="header-right">
      <button class="btn-tv-header" onclick="openTvDisplay()" title="Buka Layar Antrean untuk Layar TV (HDMI)">
        <span>📺</span> <span>Buka Layar TV</span>
      </button>
      <span id="sync-badge" class="sync-badge local">
        <span>●</span> <span>Mode Lokal (Offline)</span>
      </span>
      <span id="header-user-info" class="header-user"></span>
      <button onclick="doLogout()">Keluar</button>
    </div>
  </header>

  <!-- Kontainer Aplikasi -->
  <div id="app">
    <!-- Sidebar Navigasi -->
    <nav id="nav-bar"></nav>

    <!-- Konten Utama Halaman -->
    <main id="main-content"></main>
  </div>

  <!-- Modal Login -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal-content">
      <h2>
        <span id="login-brand-logo">🏥</span>
        <span id="login-brand-title">Klinik Sehat</span>
      </h2>
      <div style="margin-bottom:12px;">
        <label style="display:block;margin-bottom:4px;font-size:12px;font-weight:600;color:var(--mu);">Username</label>
        <input id="login-username" style="width:100%;box-sizing:border-box;" placeholder="kasir / admin / pimpinan">
      </div>
      <div style="margin-bottom:14px;">
        <label style="display:block;margin-bottom:4px;font-size:12px;font-weight:600;color:var(--mu);">Password</label>
        <input id="login-password" type="password" style="width:100%;box-sizing:border-box;" placeholder="Masukkan password" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <p id="login-error" class="bad" style="font-size:12px;margin:6px 0;"></p>
      <button class="p" style="width:100%;padding:10px;font-weight:600;" onclick="doLogin()">Masuk ke Sistem</button>

      <div style="margin-top:18px;padding:12px;background:var(--bg);border-radius:10px;font-size:12px;color:var(--mu);">
        <b>Akun Uji Coba Tersedia:</b><br>
        • Kasir: <code>kasir</code> / <code>kasir123</code><br>
        • Admin Gudang & Keu: <code>admin</code> / <code>admin123</code><br>
        • Pimpinan: <code>pimpinan</code> / <code>pimpinan123</code>
      </div>
    </div>
  </div>

  <!-- Modal Alert Standar -->
  <div class="modal-overlay" id="modal-alert">
    <div class="modal-content">
      <h3 id="modal-alert-title" style="margin-top:0;">Informasi</h3>
      <div id="modal-alert-body"></div>
      <div style="text-align:right;margin-top:16px;">
        <button class="p" onclick="closeAlert()">Tutup</button>
      </div>
    </div>
  </div>

  <!-- Modal Konfirmasi (Yes/No) -->
  <div class="modal-overlay" id="modal-confirm">
    <div class="modal-content">
      <h3 id="modal-confirm-title" style="margin-top:0;">Konfirmasi Tindakan</h3>
      <div id="modal-confirm-body"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px;">
        <button onclick="closeConfirm()">Batal</button>
        <button id="modal-confirm-yes" class="p btn-danger">Ya, Lanjutkan</button>
      </div>
    </div>
  </div>

  <!-- Modal Form Edit Dinamis -->
  <div class="modal-overlay" id="modal-form">
    <div class="modal-content">
      <h3 id="modal-form-title" style="margin-top:0;">Formulir</h3>
      <div id="modal-form-body"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px;">
        <button onclick="closeFormModal()">Batal</button>
        <button id="modal-form-submit" class="p">Simpan Perubahan</button>
      </div>
    </div>
  </div>

  <!-- Modal Struk / Nota Pasien (Khusus Cetak Thermal) -->
  <div class="modal-overlay" id="modal-nota">
    <div class="modal-content">
      <div id="modal-nota-body"></div>
      <div id="modal-nota-actions" class="no-print" style="display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:16px;">
        <button onclick="closeReceipt()">Tutup</button>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button id="btn-wa-receipt" class="p" style="background:#16a34a;border-color:#16a34a;display:none;">📲 Kirim WhatsApp</button>
          <button id="btn-label-obat-nota" class="p" style="background:#0284c7;border-color:#0284c7;display:none;">🏷️ Cetak Label Obat</button>
          <button class="p" onclick="window.print()">🖨️ Cetak Struk (Print)</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Cetak Label Obat (Etiket Farmasi Standar Thermal/Stiker) -->
  <div class="modal-overlay" id="modal-label-obat">
    <div class="modal-content wide" style="max-width:820px;">
      <div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid var(--bdr);padding-bottom:10px;">
        <h3 style="margin:0;display:flex;align-items:center;gap:8px;">
          <span>🏷️</span> <span>Cetak Label &amp; Etiket Obat (Farmasi)</span>
        </h3>
        <button onclick="closeLabelObatModal()" style="font-size:16px;padding:4px 10px;">✕</button>
      </div>

      <!-- Area Pengaturan Dosis & Jenis Etiket -->
      <div id="modal-label-obat-editor" class="no-print" style="margin-bottom:16px;"></div>

      <!-- Area Preview & Target Cetak -->
      <div id="modal-label-obat-preview"></div>

      <div class="no-print" style="display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:18px;border-top:1px solid var(--bdr);padding-top:14px;flex-wrap:wrap;">
        <button onclick="closeLabelObatModal()">Tutup</button>
        <div style="display:flex;gap:8px;">
          <button class="p" style="background:#0284c7;border-color:#0284c7;" onclick="window.print()">🖨️ Cetak Semua Label (Print)</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Konfirmasi Tutup Shift & Pengiriman WA Owner -->
  <div class="modal-overlay" id="modal-shift-close">
    <div class="modal-content" style="max-width:520px;">
      <div id="modal-shift-close-body"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px;" id="modal-shift-close-actions">
        <button onclick="closeShiftCloseModal()">Tutup</button>
      </div>
    </div>
  </div>

  <!-- Script Modules -->
  <script src="js/helpers.js"></script>
  <script src="js/store.js"></script>
  <script src="js/firebase-backend.js"></script>
  <script src="js/export-helper.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
